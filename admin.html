<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pixiun Realty | Admin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">

<header class="site-header">

  <a class="brand" href="/">
    <span class="brand-mark">P</span>

    <span>
      <strong>PIXIUN</strong>
      <small>REALTY LLC</small>
    </span>
  </a>

  <a class="text-link" href="/">
    View website →
  </a>

</header>


<main class="admin-wrap">

  <!-- LOGIN -->

  <section id="loginSection" class="admin-card">

    <p class="eyebrow">PIXIUN REALTY</p>

    <h1>Admin sign in</h1>

    <p>Sign in to manage your property listings.</p>

    <form id="loginForm" novalidate>

      <input
        id="adminEmail"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
        required
      >

      <input
        id="adminPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button class="primary" type="submit">
        Sign in
      </button>

      <p id="loginMessage" class="form-message"></p>

    </form>

  </section>


  <!-- ADMIN -->

  <section id="adminSection" class="admin-card hidden">

    <div class="admin-head">

      <div>

        <p class="eyebrow">
          PROPERTY MANAGEMENT
        </p>

        <h1 id="formHeading">
          Add a property
        </h1>

      </div>

      <button
        id="logoutBtn"
        class="secondary"
        type="button"
      >
        Sign out
      </button>

    </div>


    <!-- PROPERTY FORM -->

    <form
      id="propertyForm"
      class="admin-form"
      novalidate
    >

      <input
        id="propertyTitle"
        type="text"
        placeholder="Property title"
        required
      >

      <textarea
        id="propertyDescription"
        placeholder="Property description"
        required
      ></textarea>


      <div class="form-grid">

        <input
          id="propertyPrice"
          type="number"
          min="0"
          step="1"
          placeholder="Price (USD)"
          required
        >

        <input
          id="propertyLocation"
          type="text"
          placeholder="City, State"
          required
        >

        <select id="propertyType" required>

          <option value="">
            Property type
          </option>

          <option value="House">House</option>
          <option value="Apartment">Apartment</option>
          <option value="Condo">Condo</option>
          <option value="Townhouse">Townhouse</option>
          <option value="Land">Land</option>

        </select>


        <select id="propertyStatus" required>

          <option value="For Sale">
            For Sale
          </option>

          <option value="For Rent">
            For Rent
          </option>

        </select>


        <input
          id="propertyBedrooms"
          type="number"
          min="0"
          placeholder="Bedrooms"
          required
        >

        <input
          id="propertyBathrooms"
          type="number"
          min="0"
          step="0.5"
          placeholder="Bathrooms"
          required
        >

        <input
          id="propertySquareFeet"
          type="number"
          min="0"
          placeholder="Square feet"
          required
        >

      </div>


      <!-- BUTTONS -->

      <div class="admin-form-actions">

        <button
          id="submitPropertyBtn"
          class="primary"
          type="submit"
        >
          Publish property
        </button>

        <button
          id="cancelEditBtn"
          class="secondary hidden"
          type="button"
        >
          Cancel edit
        </button>

      </div>

      <p id="formMessage" class="form-message"></p>

    </form>


    <!-- =================================================
         PHOTO SELECTOR
         IMPORTANT: THIS IS OUTSIDE THE FORM.
    ================================================== -->

    <div class="photo-upload-area">

      <label
        id="photoLabel"
        class="upload-label"
        for="propertyPhotos"
      >
        Property photos
      </label>

      <input
        id="propertyPhotos"
        type="file"
        accept="image/*"
        multiple
      >

      <p
        id="photoHelp"
        class="photo-help"
      >
        Select one or more photos for this property.
      </p>

    </div>


    <!-- LISTINGS -->

    <div id="adminListings"></div>

  </section>

</main>


<script
  type="module"
  src="admin.js?v=6"
></script>

</body>
</html>
