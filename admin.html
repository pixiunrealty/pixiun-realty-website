<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixiun Realty | Admin</title><link rel="stylesheet" href="style.css"></head><body class="admin-page">
<header class="site-header"><a class="brand" href="/"><span class="brand-mark">P</span><span><strong>PIXIUN</strong><small>REALTY LLC</small></span></a><a class="text-link" href="/">View website →</a></header>
<main class="admin-wrap"><section id="loginPanel" class="admin-card"><p class="eyebrow">PIXIUN REALTY</p><h1>Admin sign in</h1><p>Sign in to manage your property listings.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="primary" type="submit">Sign in</button><p id="loginMessage" class="form-message"></p></form></section>
<section id="adminPanel" class="admin-card hidden"><div class="admin-head"><div><p class="eyebrow">PROPERTY MANAGEMENT</p><h1>Add a property</h1></div><button id="logoutBtn" class="secondary">Sign out</button></div><form id="propertyForm" class="admin-form"><input id="title" placeholder="Property title" required><textarea id="description" placeholder="Property description" required></textarea><div class="form-grid"><input id="price" type="number" min="0" step="1" placeholder="Price (USD)" required><input id="location" placeholder="City, State" required><select id="propertyType" required><option value="">Property type</option><option>House</option><option>Apartment</option><option>Condo</option><option>Townhouse</option><option>Land</option></select><select id="status" required><option>For Sale</option><option>For Rent</option></select><input id="bedrooms" type="number" min="0" placeholder="Bedrooms" required><input id="bathrooms" type="number" min="0" step="0.5" placeholder="Bathrooms" required><input id="squareFeet" type="number" min="0" placeholder="Square feet" required></div><label class="upload-label">Property photos<input id="photos" type="file" accept="image/*" multiple required></label><button class="primary" type="submit">Publish property</button><p id="propertyMessage" class="form-message"></p></form><div id="adminListings"></div></section></main><script type="module" src="admin.js"></script></body></html>
